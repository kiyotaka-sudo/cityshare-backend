<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CityShare — Aperçu de l'application</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --g1: #1a5c2a;
    --g2: #2d7a3f;
    --g3: #4caf6e;
    --gold: #c9a227;
    --dark: #0b1610;
    --card-bg: rgba(255,255,255,0.035);
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--dark);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content:'';
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 80% 55% at 5% 0%,  rgba(26,92,42,0.50) 0%, transparent 55%),
      radial-gradient(ellipse 50% 45% at 95% 100%,rgba(45,122,63,0.35) 0%, transparent 55%),
      radial-gradient(ellipse 35% 35% at 50% 50%, rgba(201,162,39,0.07) 0%, transparent 65%);
    pointer-events:none; z-index:0;
  }

  .wrapper {
    position:relative; z-index:1;
    max-width:1340px;
    margin:0 auto;
    padding:56px 36px 72px;
  }

  /* HEADER */
  .header { text-align:center; margin-bottom:52px; }

  .badge {
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(76,175,110,0.13);
    border:1px solid rgba(76,175,110,0.32);
    border-radius:40px;
    padding:5px 18px;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--g3); font-weight:500;
    margin-bottom:20px;
  }
  .badge::before {
    content:''; width:7px; height:7px;
    border-radius:50%; background:var(--g3);
    animation:blink 2s infinite;
  }
  @keyframes blink {
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.4;transform:scale(1.5)}
  }

  .header h1 {
    font-family:'Syne',sans-serif;
    font-size:clamp(44px,6vw,76px);
    font-weight:800; color:#fff;
    line-height:1; letter-spacing:-.025em;
  }
  .header h1 em { color:var(--g3); font-style:normal; }

  .header p {
    margin-top:14px; font-size:15px;
    color:rgba(255,255,255,.40); font-weight:300;
  }

  .hline {
    width:56px; height:3px;
    background:linear-gradient(90deg,var(--g3),var(--gold));
    border-radius:2px; margin:22px auto 0;
  }

  /* STATS */
  .stats {
    display:flex; justify-content:center; align-items:center;
    gap:0; margin-bottom:48px;
    border:1px solid rgba(255,255,255,.07);
    border-radius:16px; overflow:hidden;
    width:fit-content; margin-left:auto; margin-right:auto;
  }
  .stat {
    padding:18px 36px; text-align:center;
    border-right:1px solid rgba(255,255,255,.07);
  }
  .stat:last-child { border-right:none; }
  .stat-n {
    font-family:'Syne',sans-serif;
    font-size:26px; font-weight:800;
    color:var(--g3); line-height:1;
  }
  .stat-l {
    font-size:11px; color:rgba(255,255,255,.30);
    text-transform:uppercase; letter-spacing:.1em; margin-top:3px;
  }

  /* CADRE PRINCIPAL */
  .frame {
    position:relative;
    padding:36px 36px 40px;
    border-radius:28px;
    background:rgba(255,255,255,.02);
  }
  .frame::before {
    content:''; position:absolute; inset:0;
    border-radius:28px; padding:1.5px;
    background:linear-gradient(135deg,
      rgba(76,175,110,.6),
      rgba(201,162,39,.5),
      rgba(76,175,110,.15),
      rgba(201,162,39,.45));
    -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
  }

  /* Coins déco */
  .fc { position:absolute; width:22px; height:22px; border-color:var(--gold); border-style:solid; }
  .fc.tl{top:10px;left:10px;border-width:2px 0 0 2px;border-radius:5px 0 0 0;}
  .fc.tr{top:10px;right:10px;border-width:2px 2px 0 0;border-radius:0 5px 0 0;}
  .fc.bl{bottom:10px;left:10px;border-width:0 0 2px 2px;border-radius:0 0 0 5px;}
  .fc.br{bottom:10px;right:10px;border-width:0 2px 2px 0;border-radius:0 0 5px 0;}

  /* Titre de section */
  .section-title {
    font-family:'Syne',sans-serif;
    font-size:11px; font-weight:700;
    letter-spacing:.16em; text-transform:uppercase;
    color:rgba(76,175,110,.65);
    margin-bottom:18px;
    padding-left:4px;
  }

  /* GRILLES */
  .grid4 {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
  }
  .grid3 {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    max-width:75%;
    margin:0 auto;
  }
  .section-gap { margin-top:28px; }

  /* CARD */
  .card {
    border-radius:20px; overflow:hidden;
    background:var(--card-bg);
    border:1px solid rgba(255,255,255,.07);
    cursor:pointer;
    transition:
      transform .32s cubic-bezier(.22,.68,0,1.2),
      box-shadow .32s ease,
      border-color .25s ease;
    animation:fadeUp .55s ease both;
  }
  .card:hover {
    transform:translateY(-10px) scale(1.025);
    border-color:rgba(76,175,110,.55);
    box-shadow:
      0 28px 55px rgba(0,0,0,.55),
      0 0 0 1px rgba(76,175,110,.18),
      0 0 35px rgba(26,92,42,.28);
  }
  @keyframes fadeUp {
    from{opacity:0;transform:translateY(28px)}
    to{opacity:1;transform:translateY(0)}
  }

  .card img {
    width:100%; display:block;
    aspect-ratio:591/1280;
    object-fit:cover; object-position:top;
  }

  .card-foot {
    padding:11px 14px 13px;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(10px);
  }
  .card-num {
    font-family:'Syne',sans-serif;
    font-size:9px; font-weight:700;
    letter-spacing:.18em; text-transform:uppercase;
    color:var(--g3); opacity:.6;
  }
  .card-name {
    font-size:12.5px; font-weight:500;
    color:rgba(255,255,255,.85);
    margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* FOOTER */
  .footer {
    text-align:center; margin-top:44px;
    font-size:12px; color:rgba(255,255,255,.18);
    letter-spacing:.06em;
  }
  .footer strong { color:var(--g3); }

  /* LIGHTBOX */
  .lb {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.90);
    backdrop-filter:blur(14px);
    z-index:999;
    align-items:center; justify-content:center;
    flex-direction:column; gap:18px;
  }
  .lb.on { display:flex; }
  .lb img {
    max-height:87vh; max-width:340px;
    border-radius:22px;
    box-shadow:0 40px 80px rgba(0,0,0,.8);
    animation:zin .28s cubic-bezier(.22,.68,0,1.2);
  }
  @keyframes zin {
    from{opacity:0;transform:scale(.82)}
    to{opacity:1;transform:scale(1)}
  }
  .lb-name {
    font-family:'Syne',sans-serif;
    font-size:15px; font-weight:600;
    color:rgba(255,255,255,.75);
  }
  .lb-x {
    position:fixed; top:22px; right:22px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.18);
    color:#fff; width:40px; height:40px;
    border-radius:50%; font-size:19px;
    cursor:pointer; display:flex;
    align-items:center; justify-content:center;
    transition:background .2s;
  }
  .lb-x:hover { background:rgba(255,255,255,.22); }

  /* Délais */
  .d1{animation-delay:.04s}.d2{animation-delay:.09s}
  .d3{animation-delay:.14s}.d4{animation-delay:.19s}
  .d5{animation-delay:.24s}.d6{animation-delay:.29s}
  .d7{animation-delay:.34s}.d8{animation-delay:.39s}
  .d9{animation-delay:.44s}.d10{animation-delay:.49s}
  .d11{animation-delay:.54s}
</style>
</head>

<div class="wrapper">

  <div class="header">
    <div class="badge">Application mobile React Native</div>
    <h1>City<em>Share</em></h1>
    <p>Voyagez &amp; livrez, ensemble — Cameroun 🇨🇲</p>
    <div class="hline"></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-n">11</div><div class="stat-l">Écrans</div></div>
    <div class="stat"><div class="stat-n">3</div><div class="stat-l">Rôles</div></div>

  <div class="frame">

    <div class="section-title">Parcours utilisateur — 11 écrans</div>

    <div class="grid4" id="row1"></div>

    <!-- Ligne 2 : écrans 5-8 -->
    <div class="grid4 section-gap" id="row2"></div>

    <!-- Ligne 3 : écrans 9-11 centrés -->
    <div class="section-gap" style="display:flex;justify-content:center">
      <div class="grid3" id="row3"></div>
    </div>
  </div>

  <div class="footer">
    <strong>CityShare MVP</strong> &nbsp;·&nbsp;
    Keyce Informatique &amp; Intelligence Artificielle &nbsp;·&nbsp; 2025–2026
  </div>
</div>

<!-- Lightbox -->
<div class="lb" id="lb" onclick="closeLb(event)">

const LABELS = ["Splash Screen","Accueil Passager","Dashboard Conducteur",
  "Suivi en temps réel","Scanner QR Code","Paiement Mobile Money",
  "Messagerie","Alerte SOS","Profil Passager","Profil Conducteur",
  "Envoyer un Colis"];

function openLb(src, name) {
  const lb = document.getElementById('lb');
  document.getElementById('lb-img').src = src;
  document.getElementById('lb-name').textContent = name;
  lb.classList.add('on');
}
function closeLb(e) {
  if (!e || e.target === document.getElementById('lb') || e.target.classList.contains('lb-x')) {
    document.getElementById('lb').classList.remove('on');
    document.getElementById('lb-img').src = '';
  }
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeLb(); });

function makeCard(screen, idx) {
  const d = document.createElement('div');
  d.className = 'card d'+(idx+1);
  d.innerHTML =
    '<img src="'+screen.src+'" alt="'+screen.label+'" loading="lazy">' +
    '<div class="card-foot">' +
      '<div class="card-num">Écran ' + String(idx+1).padStart(2,'0') + '</div>' +
      '<div class="card-name">' + screen.label + '</div>' +
    '</div>';
  d.onclick = () => openLb(screen.src, screen.label);
  return d;
}

const row1 = document.getElementById('row1');
const row2 = document.getElementById('row2');
const row3 = document.getElementById('row3');

SCREENS.slice(0,4).forEach((s,i)  => row1.appendChild(makeCard(s, i)));
