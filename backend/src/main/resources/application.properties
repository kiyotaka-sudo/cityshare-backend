# =============================================
#   CityShare - Configuration Spring Boot
# =============================================

server.port=8080

# H2 Database (dev)
spring.datasource.url=jdbc:h2:mem:citysharedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
cityshare.jwt.secret=CityShareSecretKey2024SuperSecureKeyForJWTTokenGeneration
cityshare.jwt.expiration=86400000

# CORS
cityshare.cors.allowed-origins=*

# Logging
logging.level.com.cityshare=DEBUG
logging.level.org.springframework.security=INFO
